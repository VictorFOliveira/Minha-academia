name: Minha Academia CI

on:
  push:
    branches: [main, feat/saas-foundation]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: minha_academia
          POSTGRES_USER: academia
          POSTGRES_PASSWORD: academia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academia -d minha_academia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://academia:academia_test@localhost:5432/minha_academia
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: minha-academia-ci-secret-with-at-least-32-characters
      NODE_ENV: test
      SEED_DEMO: true
      RATE_LIMIT_API: 10000
      RATE_LIMIT_LOGIN: 1000
      INTEGRATION_ENCRYPTION_KEY: ci-integration-encryption-key-with-more-than-32-characters
      PLATFORM_ADMIN_EMAIL: platform@minhaacademia.local
      PLATFORM_ADMIN_PASSWORD: Platform@123
      PLATFORM_ADMIN_NAME: Platform CI
      PLATFORM_JWT_SECRET: minha-academia-platform-ci-secret-at-least-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize database
        env:
          PGPASSWORD: academia_test
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U academia -d minha_academia -f db/init.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U academia -d minha_academia -f db/migrations/001_initial.sql

      - name: API dependencies
        working-directory: api
        run: npm install

      - name: API migrations
        working-directory: api
        run: node -e "import('./src/migrate.js').then(async m=>{await m.migrate();const {pool}=await import('./src/db.js');await pool.end()})"

      - name: API tests
        working-directory: api
        run: npm test

      - name: Access Agent dependencies
        working-directory: access-agent
        run: npm install

      - name: Access Agent syntax
        working-directory: access-agent
        run: |
          node --check src/index.js
          node --check src/cloud.js
          node --check src/store.js
          node --check src/engine.js
          node --check src/adapters/http.js
          node --check src/adapters/tcp.js
          node --check src/adapters/controlId.js

      - name: Access Agent tests
        working-directory: access-agent
        run: npm test

      - name: Web dependencies
        working-directory: web
        run: npm install

      - name: Web build
        working-directory: web
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config
