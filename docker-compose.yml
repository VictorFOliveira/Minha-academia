services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minha_academia
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academia_dev}
    volumes:
      - academia_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d minha_academia"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server","--save","","--appendonly","no","--maxmemory-policy","allkeys-lru"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: 3333
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://academia:${POSTGRES_PASSWORD:-academia_dev}@db:5432/minha_academia
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-academia-local-development-secret-change-me-123456}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_DEMO: ${SEED_DEMO:-true}
      MIGRATIONS_DIR: /app/migrations
      ENABLE_JOBS: ${ENABLE_JOBS:-true}
      JOB_INTERVAL_MS: ${JOB_INTERVAL_MS:-3600000}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-local-development-integration-encryption-key-change-me-12345}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-platform-local-development-secret-change-me-12345}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Superadmin}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
      RATE_LIMIT_SECURITY: ${RATE_LIMIT_SECURITY:-10}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PLATFORM_ASAAS_ENV: ${PLATFORM_ASAAS_ENV:-SANDBOX}
      PLATFORM_ASAAS_API_KEY: ${PLATFORM_ASAAS_API_KEY:-}
      PLATFORM_ASAAS_WEBHOOK_TOKEN: ${PLATFORM_ASAAS_WEBHOOK_TOKEN:-}
      PLATFORM_ALERT_EMAIL: ${PLATFORM_ALERT_EMAIL:-}
      SAAS_BILLING_DAY: ${SAAS_BILLING_DAY:-10}
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  academia_data:
